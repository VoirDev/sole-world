<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sole World Admin Sign In</title>
    <link rel="stylesheet" href="/admin/styles.css">
</head>
<body class="auth-page">
<main class="auth-shell">
    <section class="auth-panel">
        <p class="eyebrow">Sole World</p>
        <h1>Admin sign in</h1>
        <form class="auth-form" method="post" action="/admin/login">
            <label>
                Username
                <input name="username" autocomplete="username" required autofocus>
            </label>
            <label>
                Password
                <input name="password" type="password" autocomplete="current-password" required>
            </label>
            <p class="form-message" data-error>Invalid username or password.</p>
            <p class="form-message" data-logout>You have signed out.</p>
            <p class="form-message" data-forbidden>Sign in again to continue.</p>
            <p class="form-message" data-csrf-error>Security token unavailable. Refresh the page.</p>
            <button class="primary-button" type="submit" disabled data-submit>Sign in</button>
        </form>
    </section>
</main>
<script>
    const params = new URLSearchParams(window.location.search);
    const form = document.querySelector(".auth-form");
    const submitButton = document.querySelector("[data-submit]");

    document.body.toggleAttribute("data-has-error", params.has("error"));
    document.body.toggleAttribute("data-has-logout", params.has("logout"));
    document.body.toggleAttribute("data-has-forbidden", params.has("forbidden"));

    form.addEventListener("submit", (event) => {
        if (submitButton.disabled) {
            event.preventDefault();
        }
    });

    fetch("/admin/api/csrf", { headers: { "Accept": "application/json" } })
        .then((response) => {
            if (!response.ok) throw new Error("Unable to load CSRF token");
            return response.json();
        })
        .then((csrfToken) => {
            const input = document.createElement("input");
            input.type = "hidden";
            input.name = csrfToken.parameterName;
            input.value = csrfToken.token;
            form.append(input);
            submitButton.disabled = false;
        })
        .catch(() => {
            document.body.toggleAttribute("data-has-csrf-error", true);
        });
</script>
</body>
</html>
