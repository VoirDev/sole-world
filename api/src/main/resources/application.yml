spring:
  application:
    name: sole-world

  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_PHASE_TIMEOUT:30s}

  web:
    error:
      include-message: ${WEB_ERROR_INCLUDE_MESSAGE:never}
      include-binding-errors: ${WEB_ERROR_INCLUDE_BINDING_ERRORS:never}

  mvc:
    # Framework-raised failures (unknown route, wrong method) answer with RFC 9457 documents, so the
    # error shape is the same whether the failure came from this application or from Spring.
    problemdetails:
      enabled: true

server:
  shutdown: ${SERVER_SHUTDOWN:graceful}
  port: ${SERVER_PORT:8080}

  tomcat:
    threads:
      # Every request reads an in-memory index and returns a bounded page, so a worker is busy for
      # about a millisecond. The container default of 200 buys no throughput and costs up to 200 MB
      # of thread stacks out of the same memory limit the heap comes from.
      max: ${SERVER_THREADS_MAX:64}

dgs:
  graphql:
    graphiql:
      # The starter's own console resolves React and GraphiQL from a CDN on every page load, so it
      # cannot open without outbound internet access. This application serves its own instead; see
      # api.graphiql below.
      enabled: false

graphql:
  limits:
    max-depth: ${GRAPHQL_MAX_QUERY_DEPTH:30}
    max-complexity: ${GRAPHQL_MAX_QUERY_COMPLEXITY:1000}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    dev.voir.sole.world: ${SOLE_WORLD_LOG_LEVEL:${LOG_LEVEL:INFO}}
    org.springframework: ${SPRING_LOG_LEVEL:${LOG_LEVEL:INFO}}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,HEAD,POST,OPTIONS}
  allowed-headers: ${CORS_ALLOWED_HEADERS:*}

api:
  security:
    # Comma- or whitespace-separated list of accepted API keys.
    keys: ${API_KEYS:}
    # Set to false only for a deliberately public deployment.
    enabled: ${API_AUTH_ENABLED:true}

  rate-limit:
    # Per-caller request limits on /v1/** and /graphql, keyed by API key (or by address when
    # authentication is disabled). Buckets are per replica.
    enabled: ${API_RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${API_RATE_LIMIT_REQUESTS_PER_MINUTE:600}
    burst: ${API_RATE_LIMIT_BURST:120}

  docs:
    # Serves the OpenAPI contract at /openapi.yaml and its reference page at /docs.
    # When false neither route exists, and neither is treated as public.
    enabled: ${API_DOCS_ENABLED:true}

  assets:
    # Origin media asset paths are published under. Empty publishes them rooted at this deployment
    # (/assets/flags/...). Set it to a CDN origin that holds flags/ and cryptos/ at its root to
    # publish absolute URLs pointing there instead (https://cdn.example.com/flags/...).
    base-url: ${ASSET_BASE_URL:}
    # Directory /assets/** is served from, beside the jar rather than inside it. Only read while
    # base-url is empty. Not an operator setting: the image puts the files here, and the tests point
    # it at a small fixture instead.
    directory: assets

  graphiql:
    # Serves the GraphiQL console at /graphiql.
    # When false the route does not exist, and it is not treated as public.
    enabled: ${GRAPHIQL_ENABLED:true}
