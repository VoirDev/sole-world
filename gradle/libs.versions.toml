[versions]
# Kotlin
kotlin = "2.4.20" # https://kotlinlang.org/docs/releases.html
kotlinx-serialization-json = "1.11.0" # https://github.com/Kotlin/kotlinx.serialization
kotlinx-datetime = "0.8.0" # https://github.com/Kotlin/kotlinx-datetime

# Spring
spring-boot = "4.1.1" # https://spring.io/projects/spring-boot
# Ahead of the version Spring Boot pins, which the release image scan flags for CVE-2026-65182,
# CVE-2026-65905 and CVE-2026-68525. Drop this override once Boot's own pin reaches it.
tomcat = "11.0.26" # https://tomcat.apache.org/security-11.html

# DGS
dgs = "12.1.0" # https://github.com/netflix/dgs-framework
dgs-codegen = "8.6.0" # https://github.com/Netflix/dgs-codegen
openapi-generator = "7.25.0" # https://github.com/OpenAPITools/openapi-generator
ktlint-plugin = "14.2.0" # https://github.com/JLLeitschuh/ktlint-gradle

[libraries]
# Spring
springBoot-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "spring-boot" }
springBoot-validation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "spring-boot" }
springBoot-devTools = { module = "org.springframework.boot:spring-boot-devtools", version.ref = "spring-boot" }
springBoot-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring-boot" }

# GraphQL
dgs-platformDependencies = { module = "com.netflix.graphql.dgs:graphql-dgs-platform-dependencies", version.ref = "dgs" }
dgs-starter = { module = "com.netflix.graphql.dgs:dgs-starter" }

# Kotlin
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime" }

# Security overrides. See the comment beside the `tomcat` version above.
tomcat-embedCore = { module = "org.apache.tomcat.embed:tomcat-embed-core", version.ref = "tomcat" }
tomcat-embedEl = { module = "org.apache.tomcat.embed:tomcat-embed-el", version.ref = "tomcat" }
tomcat-embedWebsocket = { module = "org.apache.tomcat.embed:tomcat-embed-websocket", version.ref = "tomcat" }

[plugins]
kotlinSpring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
dgs-codegen = { id = "com.netflix.dgs.codegen", version.ref = "dgs-codegen" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
