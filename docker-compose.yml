name: sole-world

services:
  sole-world-api:
    image: ${API_IMAGE:-ghcr.io/voirdev/sole-world-api:latest}
    container_name: sole-world-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-18080}:8080"

    # A read-only service that serves data compiled into its own image needs none of what these take
    # away. The image already drops to an unprivileged user; this is the same statement made to the
    # kernel, so a flaw in the application has nothing to escalate into.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # The JVM and the embedded container want a scratch directory; nothing in it outlives the
    # process, so it lives in memory rather than making the filesystem writable.
    tmpfs:
      - /tmp:mode=1777,size=64m

    environment:
      SERVER_PORT: 8080

      # --- Authentication -------------------------------------------------------------------
      # Comma- or whitespace-separated list of accepted API keys, at least 16 characters each.
      # Generate one with: openssl rand -hex 32
      API_KEYS: ${API_KEYS:?set API_KEYS to one or more API keys, or set API_AUTH_ENABLED=false}
      # Set to false only for a deliberately public deployment.
      API_AUTH_ENABLED: ${API_AUTH_ENABLED:-true}

      # --- Developer consoles ---------------------------------------------------------------
      # Each console is removed from the application when switched off: the routes stop existing
      # rather than merely being hidden.
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      GRAPHIQL_ENABLED: ${GRAPHIQL_ENABLED:-true}

      # --- Browser access -------------------------------------------------------------------
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}

      # --- Assets ---------------------------------------------------------------------------
      # Empty publishes asset paths rooted at this deployment; set a CDN origin to point elsewhere.
      ASSET_BASE_URL: ${ASSET_BASE_URL:-}

      # --- Limits and logging ---------------------------------------------------------------
      GRAPHQL_MAX_QUERY_DEPTH: ${GRAPHQL_MAX_QUERY_DEPTH:-30}
      GRAPHQL_MAX_QUERY_COMPLEXITY: ${GRAPHQL_MAX_QUERY_COMPLEXITY:-1000}
      API_RATE_LIMIT_ENABLED: ${API_RATE_LIMIT_ENABLED:-true}
      API_RATE_LIMIT_REQUESTS_PER_MINUTE: ${API_RATE_LIMIT_REQUESTS_PER_MINUTE:-600}
      API_RATE_LIMIT_BURST: ${API_RATE_LIMIT_BURST:-120}
      SERVER_THREADS_MAX: ${SERVER_THREADS_MAX:-64}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    # The dataset is read-only and ships inside the image, so the service keeps it all in memory.
    # There is no database, no volume and no migration step.
    #
    # The limit covers the heap and everything beside it -- metaspace, the code cache and worker
    # thread stacks. See "Resources" in the README for the measurements behind this number.
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-768M}
          cpus: "${API_CPU_LIMIT:-2}"
          pids: ${API_PIDS_LIMIT:-256}

    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O- http://localhost:8080/healthz || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
