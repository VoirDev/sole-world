  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type: { type: string, description: Problem type URI. }
        title: { type: string, description: Short, human-readable summary. }
        status: { type: integer, format: int32, description: HTTP status code. }
        detail: { type: string, description: Explanation specific to this occurrence. }
        instance: { type: string, description: URI reference identifying this occurrence. }
        allowed:
          type: array
          description: Accepted values, supplied when a parameter was rejected for being unknown.
          items: { type: string }

    PageInfo:
      type: object
      description: Where a page sits in the full result.
      required: [page, size, totalItems, totalPages, hasNextPage, hasPreviousPage]
      properties:
        page: { type: integer, format: int32 }
        size: { type: integer, format: int32 }
        totalItems: { type: integer, format: int32 }
        totalPages: { type: integer, format: int32 }
        hasNextPage: { type: boolean }
        hasPreviousPage: { type: boolean }

    Coordinates:
      type: object
      description: Geographic coordinates in decimal degrees.
      required: [latitude, longitude]
      properties:
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }

    Meta:
      type: object
      description: What this deployment serves and the limits it applies.
      required: [datasetVersion, datasetDate, supportedLanguages, maxPageSize, maxIncludedItems]
      properties:
        datasetVersion: { type: integer, format: int32 }
        datasetDate: { type: string }
        supportedLanguages:
          type: array
          description: Translation languages accepted by `Accept-Language` and `lang`.
          items: { type: string }
        maxPageSize: { type: integer, format: int32 }
        maxIncludedItems:
          type: integer
          format: int32
          description: Largest number of records returned inside an included collection.
        counts:
          type: object
          description: Number of records of each kind in the loaded dataset.
          additionalProperties: { type: integer, format: int32 }
        rateLimit:
          $ref: "#/components/schemas/RateLimit"

    RateLimit:
      type: object
      description: >
        The per-key request allowance this deployment grants, counted per replica. Absent when the
        deployment does not rate limit.
      required: [requestsPerMinute, burst]
      properties:
        requestsPerMinute:
          type: integer
          format: int32
          description: Sustained request rate allowed for one key.
        burst:
          type: integer
          format: int32
          description: Requests one key may make back to back before the sustained rate applies.

    Country:
      type: object
      required: [id, name, iso2, iso3, isoNumeric, phoneCode, coordinates, regionId, subregionId]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, description: Localized display name. }
        nativeName: { type: string }
        iso2: { type: string }
        iso3: { type: string }
        isoNumeric: { type: string, description: Kept as text to preserve leading zeros. }
        phoneCode: { type: string }
        tld: { type: string }
        coordinates: { $ref: "#/components/schemas/Coordinates" }
        regionId: { type: integer, format: int64 }
        subregionId: { type: integer, format: int64 }
        flagId: { type: integer, format: int64 }
        region: { $ref: "#/components/schemas/Region" }
        subregion: { $ref: "#/components/schemas/Subregion" }
        flag: { $ref: "#/components/schemas/Flag" }
        currencies:
          type: array
          items: { $ref: "#/components/schemas/Currency" }
        languages:
          type: array
          items: { $ref: "#/components/schemas/Language" }
        timezones:
          type: array
          items: { $ref: "#/components/schemas/Timezone" }
        centralBanks:
          type: array
          items: { $ref: "#/components/schemas/CentralBank" }
        states:
          type: array
          items: { $ref: "#/components/schemas/State" }
        truncatedIncludes:
          type: array
          description: Included collections that were capped. Page through them at their own endpoint.
          items: { type: string }

    Currency:
      type: object
      required: [id, iso3, isoNumeric, name, decimalDigits, popularity, obsolete]
      properties:
        id: { type: integer, format: int64 }
        iso3: { type: string }
        isoNumeric: { type: string }
        name: { type: string, description: Localized display name. }
        nativeName: { type: string }
        description: { type: string }
        symbol: { type: string }
        decimalDigits: { type: integer, format: int32 }
        popularity:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: >
            How widely the currency is used today, from 0 to 100. The scale blends foreign-exchange
            turnover, payment share and reserve status at the top with the size of the issuing
            economy and the number of countries using it further down. Obsolete currencies score 0.
          example: 100
        year: { type: integer, format: int32 }
        introducedDate: { type: string, format: date }
        obsolete: { type: boolean }
        obsoleteAt: { type: string, format: date }
        replacedById: { type: integer, format: int64 }
        flagId: { type: integer, format: int64 }
        flag: { $ref: "#/components/schemas/Flag" }
        replacedBy: { $ref: "#/components/schemas/Currency" }
        countries:
          type: array
          items: { $ref: "#/components/schemas/Country" }
        centralBanks:
          type: array
          items: { $ref: "#/components/schemas/CentralBank" }
        truncatedIncludes:
          type: array
          items: { type: string }

    Crypto:
      type: object
      required: [id, code, alias, name, decimalDigits, obsolete]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, description: Ticker symbol the coin trades under. }
        alias:
          type: string
          description: >
            Stable lowercase key for the coin. A ticker can be renamed; the alias is what stays the
            same, and it is the name the coin's logo files are stored under.
        name: { type: string }
        description: { type: string }
        websiteUrl: { type: string }
        introducedYear: { type: integer, format: int32 }
        decimalDigits: { type: integer, format: int32 }
        obsolete: { type: boolean }
        obsoleteAt: { type: string, format: date }
        logoId: { type: integer, format: int64 }
        logo: { $ref: "#/components/schemas/MediaAsset" }
        truncatedIncludes:
          type: array
          items: { type: string }

    Language:
      type: object
      required: [id, code, name]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string, description: Localized display name. }
        nativeName: { type: string }
        description: { type: string }
        flagId: { type: integer, format: int64 }
        flag: { $ref: "#/components/schemas/Flag" }
        countries:
          type: array
          items: { $ref: "#/components/schemas/Country" }
        truncatedIncludes:
          type: array
          items: { type: string }

    Region:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, description: Localized display name. }
        subregions:
          type: array
          items: { $ref: "#/components/schemas/Subregion" }
        countries:
          type: array
          items: { $ref: "#/components/schemas/Country" }
        truncatedIncludes:
          type: array
          items: { type: string }

    Subregion:
      type: object
      required: [id, name, regionId]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, description: Localized display name. }
        regionId: { type: integer, format: int64 }
        region: { $ref: "#/components/schemas/Region" }
        countries:
          type: array
          items: { $ref: "#/components/schemas/Country" }
        truncatedIncludes:
          type: array
          items: { type: string }

    CentralBank:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, description: Localized display name. }
        nativeName: { type: string }
        websiteUrl: { type: string }
        establishmentYear: { type: integer, format: int32 }
        countries:
          type: array
          items: { $ref: "#/components/schemas/Country" }
        currencies:
          type: array
          items: { $ref: "#/components/schemas/Currency" }
        truncatedIncludes:
          type: array
          items: { type: string }

    State:
      type: object
      required: [id, name, countryId]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, description: Localized display name. }
        stateCode: { type: string }
        type: { type: string, description: Administrative division type, such as "province". }
        coordinates: { $ref: "#/components/schemas/Coordinates" }
        countryId: { type: integer, format: int64 }
        country: { $ref: "#/components/schemas/Country" }
        cities:
          type: array
          items: { $ref: "#/components/schemas/City" }
        truncatedIncludes:
          type: array
          items: { type: string }

    City:
      type: object
      required: [id, name, stateId, coordinates]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, description: Localized display name. }
        stateId: { type: integer, format: int64 }
        coordinates: { $ref: "#/components/schemas/Coordinates" }
        state: { $ref: "#/components/schemas/State" }
        country: { $ref: "#/components/schemas/Country" }
        truncatedIncludes:
          type: array
          items: { type: string }

    Timezone:
      type: object
      required: [id, zoneName, tzName, gmtOffset, gmtOffsetName, abbreviation]
      properties:
        id: { type: integer, format: int64 }
        zoneName: { type: string, description: IANA timezone name. }
        tzName: { type: string, description: Localized display name. }
        gmtOffset: { type: integer, format: int32, description: Offset from GMT in seconds. }
        gmtOffsetName: { type: string }
        abbreviation: { type: string }

    Flag:
      type: object
      required: [id, caption, emoji, emojiU]
      properties:
        id: { type: integer, format: int64 }
        caption: { type: string }
        emoji: { type: string }
        emojiU: { type: string, description: Unicode code points for the emoji. }
        squareAssetId: { type: integer, format: int64 }
        wideAssetId: { type: integer, format: int64 }
        squareAsset: { $ref: "#/components/schemas/MediaAsset" }
        wideAsset: { $ref: "#/components/schemas/MediaAsset" }

    MediaAsset:
      type: object
      required: [id, type, key, description]
      properties:
        id: { type: integer, format: int64 }
        type:
          type: string
          enum: [image]
        key:
          type: string
          description: >
            Stable machine key for the asset, and the name its files are stored under — `zw` for
            Zimbabwe's flag, `btc` for Bitcoin's logo. Match on this when a client needs to
            recognise an asset; it is unique per aspect ratio, so a flag's square and wide images
            share one.
          example: zw
        description:
          type: string
          description: Prose naming what the asset shows, for people rather than for matching.
          example: Zimbabwe flag, square
        image: { $ref: "#/components/schemas/ImageAsset" }

    ImageAsset:
      type: object
      required: [aspectRatio, formats]
      properties:
        aspectRatio:
          type: string
          enum: [square, wide]
        formats: { $ref: "#/components/schemas/ImageAssetFormats" }

    ImageAssetFormats:
      type: object
      description: Paths for each available encoding of an image asset.
      properties:
        svg: { type: string }
        png: { $ref: "#/components/schemas/ImageAssetSizes" }
        webp: { $ref: "#/components/schemas/ImageAssetSizes" }
        jpg: { $ref: "#/components/schemas/ImageAssetSizes" }

    ImageAssetSizes:
      type: object
      description: Paths for each rendered size of one bitmap format.
      properties:
        xs: { type: string }
        sm: { type: string }
        md: { type: string }
        lg: { type: string }
        xl: { type: string }

    CountryPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Country" }
        page: { $ref: "#/components/schemas/PageInfo" }

    CurrencyPage:
