[versions]
# Kotlin
kotlin = "2.3.21" # https://kotlinlang.org/docs/releases.html
kotlinx-serialization-json = "1.11.0" # https://github.com/Kotlin/kotlinx.serialization
kotlinx-coroutines = "1.11.0" # https://github.com/Kotlin/kotlinx.coroutines
kotlinx-datetime = "0.8.0" # https://github.com/Kotlin/kotlinx-datetime

# Spring
spring-boot = "4.1.0" # https://spring.io/projects/spring-boot

# DGS
dgs = "12.0.1" # https://github.com/netflix/dgs-framework
dgs-codegen = "8.5.0" # https://github.com/Netflix/dgs-codegen

# Other
logback = "1.5.34" # https://mvnrepository.com/artifact/ch.qos.logback/logback-classic

# Database
exposed = "1.3.0" # https://github.com/JetBrains/Exposed/releases
postgresql = "42.7.11" # https://mvnrepository.com/artifact/org.postgresql/postgresql
hikaricp = "7.0.2" # https://mvnrepository.com/artifact/com.zaxxer/HikariCP
flywaydb = "12.8.1" # https://mvnrepository.com/artifact/org.flywaydb/flyway-core

# Test containers
testcontainers = "2.0.5" # https://github.com/testcontainers/testcontainers-java

[libraries]
# Spring
springBoot-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "spring-boot" }
springBoot-validation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "spring-boot" }
springBoot-security = { module = "org.springframework.boot:spring-boot-starter-security", version.ref = "spring-boot" }
springBoot-devTools = { module = "org.springframework.boot:spring-boot-devtools", version.ref = "spring-boot" }
springBoot-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc", version.ref = "spring-boot" }
springBoot-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring-boot" }
springBoot-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway", version.ref = "spring-boot" }

# GraphQL
dgs-platformDependencies = { module = "com.netflix.graphql.dgs:graphql-dgs-platform-dependencies", version.ref = "dgs" }
dgs-starter = { module = "com.netflix.graphql.dgs:dgs-starter" }
dgs-extendedScalars = { module = "com.netflix.graphql.dgs:graphql-dgs-extended-scalars" }

# Database
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed" }
exposed-kotlinDatetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
flywaydb-core = { module = "org.flywaydb:flyway-core", version.ref = "flywaydb" }
flywaydb-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flywaydb" }

# Kotlin
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-reactor = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-reactor", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime" }

# Other
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# Testing
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }

[plugins]
kotlinSpring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
flywaydb = { id = "org.flywaydb.flyway", version.ref = "flywaydb" }
dgs-codegen = { id = "com.netflix.dgs.codegen", version.ref = "dgs-codegen" }
