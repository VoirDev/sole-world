name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version. Leave empty to bump the root Gradle patch version."
        required: false
        type: string
      skip_verify_checks:
        description: "Skip the regular Verify workflow on the generated release PR."
        default: true
        required: false
        type: boolean
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release PR
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          requested_version="$REQUESTED_VERSION"
          current_version="$(sed -nE 's/^val projectVersion = providers\.gradleProperty\("releaseVersion"\)\.orElse\("([^"]+)"\)\.get\(\)$/\1/p' build.gradle.kts)"

          if [ -z "$current_version" ]; then
            echo "Could not read root Gradle version from build.gradle.kts" >&2
            exit 1
          fi

          if [ -n "$requested_version" ]; then
            if ! [[ "$requested_version" =~ ^[0-9]+[.][0-9]+[.][0-9]+([.-][0-9A-Za-z.]+)?$ ]]; then
              echo "Release version must be a Docker-tag-safe semantic version, found: $requested_version" >&2
              exit 1
            fi
            release_version="$requested_version"
          else
            IFS=. read -r major minor patch <<< "$current_version"
            if [ -z "${major:-}" ] || [ -z "${minor:-}" ] || [ -z "${patch:-}" ] || ! [[ "$major" =~ ^[0-9]+$ ]] || ! [[ "$minor" =~ ^[0-9]+$ ]] || ! [[ "$patch" =~ ^[0-9]+$ ]]; then
              echo "Automatic version bump requires a numeric MAJOR.MINOR.PATCH version, found: $current_version" >&2
              exit 1
            fi
            release_version="$major.$minor.$((patch + 1))"
          fi

          sed -i -E "s/orElse\\(\"[^\"]+\"\\)/orElse(\"$release_version\")/" build.gradle.kts

          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "branch=release/v$release_version" >> "$GITHUB_OUTPUT"

      - name: Create release pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          RELEASE_BRANCH: ${{ steps.version.outputs.branch }}
          SKIP_VERIFY_CHECKS: ${{ inputs.skip_verify_checks }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "RELEASE_BOT_TOKEN is required so the release PR can trigger validation workflows." >&2
            exit 1
          fi

          if git rev-parse "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release tag already exists: v$RELEASE_VERSION" >&2
            exit 1
          fi

          gh repo view "$GITHUB_REPOSITORY" >/dev/null

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$RELEASE_BRANCH"
            git checkout "$RELEASE_BRANCH"
          else
            git checkout -b "$RELEASE_BRANCH"
          fi

          git add build.gradle.kts
          if git diff --cached --quiet; then
            echo "Release branch already contains version $RELEASE_VERSION"
          else
            git commit -m "Release v$RELEASE_VERSION"
          fi
          git push --set-upstream origin "$RELEASE_BRANCH"

          body_file="$(mktemp)"
          {
            echo "Prepares release v$RELEASE_VERSION."
            echo
            echo "This PR updates the root Gradle release version. Release validation builds the repository and the sole-world-api Docker image before merge."
            echo
            echo "After this PR is merged, the release workflow publishes:"
            echo "- ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sole-world-api:$RELEASE_VERSION and latest, for linux/amd64 and linux/arm64"
            if [ "$SKIP_VERIFY_CHECKS" = "true" ]; then
              echo
              echo "[skip verify]"
            fi
          } > "$body_file"

          existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$RELEASE_BRANCH" --base main --json url --jq '.[0].url')"
          if [ -n "$existing_pr" ]; then
            echo "Release PR already exists: $existing_pr"
            gh pr edit "$existing_pr" --body-file "$body_file"
            exit 0
          fi

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "Release v$RELEASE_VERSION" \
            --body-file "$body_file"

  validate-release-branch:
    name: Validate release PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && startsWith(github.event.pull_request.head.ref, 'release/v')
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-cleanup: always
          gradle-home-cache-includes: |
            caches/modules-2
            caches/generated-gradle-jars
            caches/jars-*
            caches/kotlin-dsl
            wrapper/dists

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          release_version="$(sed -nE 's/^val projectVersion = providers\.gradleProperty\("releaseVersion"\)\.orElse\("([^"]+)"\)\.get\(\)$/\1/p' build.gradle.kts)"

          if [ -z "$release_version" ]; then
            echo "Could not read root Gradle version from build.gradle.kts" >&2
            exit 1
          fi

          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "artifact_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build repository
        run: ./gradlew build -PreleaseVersion=${{ steps.version.outputs.release_version }} --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The image is published for both architectures its audience runs: amd64 servers, and the
      # Apple Silicon laptops the README's quick start targets, where an amd64-only image would run
      # under emulation. Only the runtime stage is built twice — the build stage is pinned to the
      # runner's own architecture, because all it produces is a jar.
      - name: Build API image artifact
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          tags: sole-world-api:release-${{ steps.version.outputs.release_version }}
          build-args: |
            RELEASE_VERSION=${{ steps.version.outputs.release_version }}
          cache-from: type=gha,scope=sole-world-api
          cache-to: type=gha,mode=min,scope=sole-world-api
          # An OCI archive, not a docker one: `docker save` cannot carry a manifest list, so a
          # multi-architecture image could not survive the trip through an artifact otherwise.
          outputs: type=oci,dest=/tmp/sole-world-api.tar
          # What was built, from what, by which workflow run, and everything inside it. Both travel
          # with the image as attestations, so a consumer can answer those questions from the
          # registry rather than from a claim in a README.
          provenance: mode=max
          sbom: true

      # A release is gated on the image being free of known critical vulnerabilities with a fix
      # available. Lower severities are reported rather than blocking: base-image advisories appear
      # and are fixed continuously, and a release that cannot go out because one landed that morning
      # is a release process that gets bypassed.
      - name: Scan API image
        shell: bash
        run: |
          set -euo pipefail

          # Trivy reads an OCI layout directory rather than the archive itself.
          mkdir -p /tmp/sole-world-api-oci
          tar -xf /tmp/sole-world-api.tar -C /tmp/sole-world-api-oci

          for platform in linux/amd64 linux/arm64; do
            echo "::group::Vulnerabilities in $platform"
            docker run --rm -v /tmp/sole-world-api-oci:/image aquasec/trivy:latest image \
              --input /image --platform "$platform" --scanners vuln --severity HIGH,MEDIUM,LOW \
              --ignore-unfixed --no-progress
            echo "::endgroup::"

            docker run --rm -v /tmp/sole-world-api-oci:/image aquasec/trivy:latest image \
              --input /image --platform "$platform" --scanners vuln --severity CRITICAL \
              --ignore-unfixed --exit-code 1 --no-progress
          done

      - name: Upload API image artifact
        uses: actions/upload-artifact@v7
        with:
          name: sole-world-api-image-${{ steps.version.outputs.release_version }}-${{ steps.version.outputs.artifact_sha }}
          path: /tmp/sole-world-api.tar
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    permissions:
      actions: write
      contents: write
      packages: write
      # Keyless signing exchanges this workflow's OIDC token for a short-lived certificate.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Resolve release version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          release_version="$(sed -nE 's/^val projectVersion = providers\.gradleProperty\("releaseVersion"\)\.orElse\("([^"]+)"\)\.get\(\)$/\1/p' build.gradle.kts)"

          if [ -z "$release_version" ]; then
            echo "Could not read root Gradle version from build.gradle.kts" >&2
            exit 1
          fi

          if git rev-parse "v$release_version" >/dev/null 2>&1; then
            should_publish=false
            echo "Release tag already exists: v$release_version"
          else
            should_publish=true
          fi

          validation_run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch "$RELEASE_BRANCH" --event pull_request --status success --json databaseId,headSha,createdAt --limit 50 | jq --arg head_sha "$RELEASE_HEAD_SHA" 'map(select(.headSha == $head_sha)) | sort_by(.createdAt) | reverse | .[0] // {}')"
          validation_run_id="$(jq -r '.databaseId // empty' <<< "$validation_run")"
          validation_head_sha="$(jq -r '.headSha // empty' <<< "$validation_run")"

          if [ "$should_publish" = "true" ] && { [ -z "$validation_run_id" ] || [ "$validation_run_id" = "null" ] || [ -z "$validation_head_sha" ] || [ "$validation_head_sha" = "null" ]; }; then
            echo "Could not find a successful release branch validation run for $RELEASE_BRANCH" >&2
            exit 1
          fi

          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
          echo "validation_run_id=$validation_run_id" >> "$GITHUB_OUTPUT"
          echo "validation_head_sha=$validation_head_sha" >> "$GITHUB_OUTPUT"

      - name: Download API image artifact
        if: steps.version.outputs.should_publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: sole-world-api-image-${{ steps.version.outputs.release_version }}-${{ steps.version.outputs.validation_head_sha }}
          path: release-artifacts/images
          run-id: ${{ steps.version.outputs.validation_run_id }}
          github-token: ${{ github.token }}

      - name: Log in to GitHub Container Registry
        if: steps.version.outputs.should_publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # skopeo rather than docker load and push, because the docker daemon on a default runner
      # cannot hold or push a manifest list. skopeo copies the archive's bytes straight to the
      # registry, which is also what keeps the published image identical to the validated one.
      - name: Install skopeo
        if: steps.version.outputs.should_publish == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes skopeo

      - name: Publish API image
        if: steps.version.outputs.should_publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          image_name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sole-world-api"
          archive="oci-archive:release-artifacts/images/sole-world-api.tar"

          for tag in "$RELEASE_VERSION" latest; do
            # --all copies every architecture in the manifest list, not just the runner's own.
            skopeo copy --all \
              --dest-creds "${REGISTRY_USERNAME}:${REGISTRY_PASSWORD}" \
              "$archive" "docker://$image_name:$tag"
          done

          skopeo inspect --raw "docker://$image_name:$RELEASE_VERSION" |
            jq -r '.manifests[].platform | select(.architecture != "unknown") | "published \(.os)/\(.architecture)"'

      # Keyless: the signature is bound to this workflow's identity in GitHub's OIDC token, so
      # there is no key to hold or rotate, and a consumer verifies against the repository and
      # workflow rather than against a public key someone has to be told to trust.
      - name: Install cosign
        if: steps.version.outputs.should_publish == 'true'
        uses: sigstore/cosign-installer@v4

      - name: Sign published image
        if: steps.version.outputs.should_publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail

          image_name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sole-world-api"

          # Sign the manifest list by digest, which covers every architecture under it.
          digest="$(skopeo inspect --format '{{.Digest}}' "docker://$image_name:$RELEASE_VERSION")"
          cosign sign --yes "$image_name@$digest"

          echo "Verify with:"
          echo "  cosign verify $image_name:$RELEASE_VERSION \\"
          echo "    --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' \\"
          echo "    --certificate-oidc-issuer https://token.actions.githubusercontent.com"

      - name: Create release tag
        if: steps.version.outputs.should_publish == 'true'
        run: git tag "v${{ steps.version.outputs.release_version }}"

      - name: Push release tag
        if: steps.version.outputs.should_publish == 'true'
        run: git push origin "v${{ steps.version.outputs.release_version }}"

      # Generated from the commits since the last tag rather than kept in a file, so it cannot drift
      # from what was actually released.
      - name: Publish release notes
        if: steps.version.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail

          image_name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sole-world-api"

          notes_file="$(mktemp)"
          {
            echo "\`\`\`bash"
            echo "docker pull $image_name:$RELEASE_VERSION"
            echo "\`\`\`"
            echo
            echo "Published for \`linux/amd64\` and \`linux/arm64\`, with an SBOM and SLSA provenance attached, and signed:"
            echo
            echo "\`\`\`bash"
            echo "cosign verify $image_name:$RELEASE_VERSION \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "\`\`\`"
          } > "$notes_file"

          gh release create "v$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v$RELEASE_VERSION" \
            --generate-notes \
            --notes-file "$notes_file"

      - name: Delete promoted release artifacts
        if: steps.version.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN_ID: ${{ steps.version.outputs.validation_run_id }}
          API_IMAGE_ARTIFACT_NAME: sole-world-api-image-${{ steps.version.outputs.release_version }}-${{ steps.version.outputs.validation_head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${VALIDATION_RUN_ID}/artifacts" \
            --jq ".artifacts[] | select(.name == \"${API_IMAGE_ARTIFACT_NAME}\") | .id" |
            while IFS= read -r artifact_id; do
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            done
