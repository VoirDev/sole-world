components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-KEY
      description: API key configured on the container through `API_KEYS`.
    BearerToken:
      type: http
      scheme: bearer
      description: The same API key, sent as a bearer token.

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page number.
      schema: { type: integer, format: int32, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      required: false
      description: Records per page.
      schema: { type: integer, format: int32, minimum: 1, maximum: 50, default: 50 }
    SearchQuery:
      name: query
      in: query
      required: false
      description: >
        Relevance-ranked search text. Matching folds case, accents and script, and tolerates typos.
      schema: { type: string, maxLength: 100 }
    FilterQuery:
      name: query
      in: query
      required: false
      description: >
        Literal name filter, matched against the record's name in any supported language. Unlike the
        search parameter on collection endpoints this does not match approximately, so the reported
        total is exact.
      schema: { type: string, maxLength: 100 }
    Lang:
      name: lang
      in: query
      required: false
      description: >
        Translation language, overriding `Accept-Language`. An unsupported value returns base
        English data. `GET /v1/meta` lists the supported languages.
      schema: { type: string }
      example: ru
    ResourceId:
      name: id
      in: path
      required: true
      description: Numeric identifier.
      schema: { type: integer, format: int64 }
    CountryIdOrCode:
      name: idOrCode
      in: path
      required: true
      description: Numeric identifier, ISO 3166-1 alpha-2 code, or alpha-3 code.
      schema: { type: string }
      example: US
    CountryInclude:
      name: include
      in: query
      required: false
      description: >
        Relationships to embed. Allowed: `region`, `subregion`, `flag`, `currencies`, `languages`,
        `timezones`, `centralBanks`, `states`.
      schema: { type: string }
    CurrencyInclude:
      name: include
      in: query
      required: false
      description: "Relationships to embed. Allowed: `flag`, `countries`, `centralBanks`, `replacedBy`."
      schema: { type: string }
    CurrencySort:
      name: sort
      in: query
      required: false
      description: >
        Field to order by: `popularity`, `name`, `code` or `year`. Defaults to `popularity`, or to
        relevance when `query` is supplied. An unrecognized value returns `400` listing the four.
      schema: { type: string }
      example: popularity
    SortOrder:
      name: order
      in: query
      required: false
      description: >
        Direction, `asc` or `desc`. Defaults to the direction the chosen field is useful in:
        descending for `popularity`, ascending for `name`, `code` and `year`.
      schema: { type: string }
      example: desc
    CryptoInclude:
      name: include
      in: query
      required: false
      description: "Relationships to embed. Allowed: `logo`."
      schema: { type: string }
    LanguageInclude:
      name: include
      in: query
      required: false
      description: "Relationships to embed. Allowed: `flag`, `countries`."
      schema: { type: string }
    RegionInclude:
      name: include
      in: query
      required: false
      description: "Relationships to embed. Allowed: `subregions`, `countries`."
      schema: { type: string }
    SubregionInclude:
      name: include
      in: query
      required: false
      description: "Relationships to embed. Allowed: `region`, `countries`."
      schema: { type: string }
    CentralBankInclude:
      name: include
      in: query
      required: false
      description: "Relationships to embed. Allowed: `countries`, `currencies`."
      schema: { type: string }
    StateInclude:
      name: include
      in: query
      required: false
      description: "Relationships to embed. Allowed: `country`, `cities`."
      schema: { type: string }
    CityInclude:
      name: include
      in: query
      required: false
      description: "Relationships to embed. Allowed: `state`, `country`."
      schema: { type: string }
    FlagInclude:
      name: include
      in: query
      required: false
      description: "Relationships to embed. Allowed: `squareAsset`, `wideAsset`."
      schema: { type: string }

  headers:
    ETag:
      description: >
        Strong validator for this exact response. The dataset is fixed for the life of a deployment,
        so a matching `If-None-Match` always yields `304`.
      schema: { type: string }
    CacheControl:
      description: >
        Caching policy for this response. `private` while the deployment requires an API key: the
        data is not confidential, but a shared cache must not hand a body fetched with a valid key
        to a caller presenting none. A deployment running with authentication off marks responses
        `public`. Static assets under `/assets/` are always `public`.
      schema: { type: string }
    Vary:
      description: Request headers this response varies by.
      schema: { type: string }

  responses:
    BadRequest:
      description: The request violates the documented contract, such as an unknown `include` value.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: No API key was supplied, or the key is not configured on this deployment.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No record matches the supplied identifier.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotModified:
      description: >
        The caller's cached copy is current. Answered before the endpoint runs, so revalidating
        costs a hash rather than the work of building the response again.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
        Vary: { $ref: "#/components/headers/Vary" }
    InternalServerError:
      description: >
        The request could not be completed. The document carries no detail about why: an unexpected
        failure is logged on the server rather than described to the caller.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: The caller has spent their request allowance.
      headers:
        Retry-After:
          description: Whole seconds to wait before the next request is allowed.
          schema: { type: integer, format: int32 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

    MetaOk:
      description: Dataset version and service limits.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Meta" }

    CountryOk:
      description: The requested country.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
        Vary: { $ref: "#/components/headers/Vary" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Country" }
    CountryPageOk:
      description: One page of countries.
      headers:
