openapi: 3.1.0

info:
  title: Sole World REST API
  version: "1.0.0"
  description: |
    Read-only world reference data: countries, currencies, languages, central banks, regions,
    subregions, states, cities, timezones, flags and media assets.

    This is the REST counterpart to the GraphQL API at `/graphql`. It trades precision for
    convenience: instead of composing a query, you ask for a resource and name the related records
    you want alongside it with `include`.

    ## Authentication

    Every endpoint requires an API key, sent either as `X-API-KEY: <key>` or as
    `Authorization: Bearer <key>`. Keys are configured on the container through `API_KEYS`.

    ## Includes

    `include` takes a comma-separated list of relationship names. Each endpoint documents exactly
    which names it accepts; anything else is a `400` that names the valid values.

    Includes are **one level deep**. An included record never carries its own includes, so
    `include=region` on a country gives you the region, not the region's countries.

    Included collections are capped at 50 records. When a collection is cut short, its name appears
    in `truncatedIncludes` and the dedicated sub-resource endpoint will page through the rest. A
    country's cities are deliberately not includable — some countries have tens of thousands — so
    use `/v1/countries/{idOrCode}/cities`.

    ## Ordering

    Collections come back ordered by the name a reader of the requested language expects. Currencies
    are the exception: they are ordered by `popularity`, most widely used first, because an
    alphabetical first page of them reaches neither the dollar nor the euro. `/v1/currencies` takes
    `sort` and `order` to choose another ordering, and every list of currencies — including the ones
    reached through `include` and the currency sub-resources — is ordered by popularity.

    ## Localization

    Translated fields follow the `Accept-Language` request header. The `lang` query parameter
    overrides it, which makes a localized response cacheable under its own URL. English, unsupported
    languages and a missing header all return the base English data. `GET /v1/meta` lists the
    supported languages.

    ## Response headers

    Every response carries `X-Content-Type-Options: nosniff` and `Referrer-Policy: no-referrer`.

    Problem documents echo part of the request back — an unknown `include` value is named in
    `detail`, and the request URI appears in `instance` — which is deliberate, and safe because the
    document is served as `application/problem+json` and will not be sniffed as anything else.

    ## Identifiers

    Every identifier in this API is an `int64`, on every resource. The dataset's own ids are far
    smaller than that, but a client should not have to track which resource happens to fit in 32
    bits and which does not.

    ## Assets

    Image paths are published rooted at this deployment — `/assets/flags/us_1x1.svg` — so they can
    be used as-is against the API's own origin. `/assets/` is served without an API key and cached
    for a year; the files are immutable for the life of the image.

    A deployment that fronts its assets with a CDN sets `ASSET_BASE_URL`, and every path becomes an
    absolute URL against that origin instead. Either way a client concatenates nothing.

    ## Caching

    The dataset is fixed for the life of a deployment, so every successful response carries a strong
    `ETag` and may be revalidated with `If-None-Match`, which answers `304`. Responses vary by
    `Accept-Language`.

    The validator depends only on the dataset version, the URL and the language that URL resolves
    to, so a conditional request is answered *before* the endpoint runs: revalidating costs a hash
    rather than the work of building the response again.

    There is no `503`. The dataset is parsed while the application starts, so the service either
    serves or is not listening — there is no partially-ready state to report.

    ## Rate limiting

    Each API key has a request allowance: a burst it may spend back to back, refilling at a
    sustained rate. Spending it returns `429` with a `Retry-After` header giving whole seconds to
    wait. `GET /v1/meta` reports the allowance this deployment grants, so a client can pace itself
    rather than discover the limit by hitting it.

    Allowances are counted per replica, so a deployment behind several replicas grants a caller that
    allowance on each of them.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: /
    description: This deployment

security:
  - ApiKeyHeader: []
  - BearerToken: []

tags:
  - name: countries
    description: Countries and territories.
  - name: currencies
    description: Currencies, including obsolete ones.
  - name: cryptos
    description: Cryptocurrencies.
  - name: languages
    description: Languages and the countries that use them.
  - name: regions
    description: Top-level geographic regions.
  - name: subregions
    description: Subregions inside a region.
  - name: central-banks
    description: Central banks, the countries they serve and the currencies they issue.
  - name: states
    description: First-level administrative divisions.
  - name: cities
    description: Populated places inside a state.
  - name: timezones
    description: Timezone records.
  - name: flags
    description: Flags and the media assets that render them.
  - name: media-assets
    description: Media asset metadata.
  - name: meta
    description: Dataset version and service capabilities.

paths:
  /v1/meta:
    get:
      tags: [meta]
      operationId: getMeta
      summary: Dataset version and service limits
      description: Reports which dataset this deployment serves and the limits every endpoint applies.
      responses:
        "200":
          $ref: "#/components/responses/MetaOk"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/countries:
    get:
      tags: [countries]
      operationId: listCountries
      summary: List or search countries
      description: |
        Returns countries ordered by localized name. When `query` is supplied the result is a
        relevance-ranked search over names in every supported language, ISO codes, phone codes and
        top-level domains, tolerant of typos and missing accents.

        Filters combine with AND.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Lang"
        - name: include
          in: query
          required: false
          description: >
            Relationships to embed. Allowed: `region`, `subregion`, `flag`, `currencies`,
            `languages`, `timezones`, `centralBanks`, `states`.
          schema: { type: string }
          example: region,currencies
        - name: regionId
          in: query
          required: false
          description: Only countries in this region.
          schema: { type: integer, format: int64 }
        - name: subregionId
          in: query
          required: false
          description: Only countries in this subregion.
          schema: { type: integer, format: int64 }
        - name: currencyId
          in: query
          required: false
          description: Only countries that use this currency.
          schema: { type: integer, format: int64 }
        - name: languageId
          in: query
          required: false
          description: Only countries that use this language.
          schema: { type: integer, format: int64 }
        - name: timezoneId
          in: query
          required: false
          description: Only countries in this timezone.
          schema: { type: integer, format: int64 }
      responses:
        "200":
          $ref: "#/components/responses/CountryPageOk"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/countries/{idOrCode}:
    get:
      tags: [countries]
      operationId: getCountry
      summary: Load one country
      description: Accepts a numeric identifier, an ISO 3166-1 alpha-2 code, or an alpha-3 code.
      parameters:
        - $ref: "#/components/parameters/CountryIdOrCode"
        - $ref: "#/components/parameters/Lang"
        - name: include
          in: query
          required: false
          description: >
            Relationships to embed. Allowed: `region`, `subregion`, `flag`, `currencies`,
            `languages`, `timezones`, `centralBanks`, `states`.
          schema: { type: string }
          example: region,subregion,currencies,flag
      responses:
        "200":
          $ref: "#/components/responses/CountryOk"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/countries/{idOrCode}/states:
    get:
      tags: [countries]
      operationId: listCountryStates
      summary: List a country's states
      description: >
        Returns the country's first-level administrative divisions ordered by localized name.
        `query` narrows the list by name; unlike the collection endpoints it is a literal filter,
        so the reported total is the exact number of records whose name contains the text.
      parameters:
        - $ref: "#/components/parameters/CountryIdOrCode"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/FilterQuery"
        - $ref: "#/components/parameters/Lang"
        - name: include
          in: query
          required: false
          description: "Relationships to embed. Allowed: `country`, `cities`."
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/StatePageOk"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/countries/{idOrCode}/cities:
    get:
      tags: [countries]
      operationId: listCountryCities
      summary: List a country's cities
      description: >
        Returns every city in the country, across all of its states, ordered by localized name.
        `query` is a literal name filter. This endpoint exists because a country's cities cannot be
        included on the country resource.
      parameters:
        - $ref: "#/components/parameters/CountryIdOrCode"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/FilterQuery"
        - $ref: "#/components/parameters/Lang"
        - name: include
          in: query
          required: false
          description: "Relationships to embed. Allowed: `state`, `country`."
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/CityPageOk"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/countries/{idOrCode}/currencies:
    get:
      tags: [countries]
      operationId: listCountryCurrencies
      summary: List the currencies a country uses
      description: Ordered by popularity, most widely used first.
      parameters:
        - $ref: "#/components/parameters/CountryIdOrCode"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Lang"
        - $ref: "#/components/parameters/CurrencyInclude"
      responses:
        "200":
          $ref: "#/components/responses/CurrencyPageOk"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/countries/{idOrCode}/languages:
    get:
      tags: [countries]
      operationId: listCountryLanguages
      summary: List the languages a country uses
      description: Includes both official and other languages recorded for the country.
      parameters:
        - $ref: "#/components/parameters/CountryIdOrCode"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Lang"
        - $ref: "#/components/parameters/LanguageInclude"
      responses:
        "200":
          $ref: "#/components/responses/LanguagePageOk"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/countries/{idOrCode}/timezones:
    get:
      tags: [countries]
      operationId: listCountryTimezones
      summary: List a country's timezones
      parameters:
        - $ref: "#/components/parameters/CountryIdOrCode"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          $ref: "#/components/responses/TimezonePageOk"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/countries/{idOrCode}/central-banks:
    get:
      tags: [countries]
      operationId: listCountryCentralBanks
      summary: List the central banks serving a country
      parameters:
        - $ref: "#/components/parameters/CountryIdOrCode"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Lang"
        - $ref: "#/components/parameters/CentralBankInclude"
      responses:
        "200":
          $ref: "#/components/responses/CentralBankPageOk"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/currencies:
    get:
      tags: [currencies]
      operationId: listCurrencies
      summary: List or search currencies
      description: >
        Returns currencies ordered by `popularity`, most widely used first, so the first page is the
        currencies a picker actually needs. `sort` and `order` choose another ordering. `query` runs
        a relevance-ranked search over names, native names, ISO codes and symbols, ranking equally
        relevant matches by popularity; an explicit `sort` overrides that ranking.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/CurrencySort"
        - $ref: "#/components/parameters/SortOrder"
        - $ref: "#/components/parameters/Lang"
        - $ref: "#/components/parameters/CurrencyInclude"
        - name: obsolete
          in: query
          required: false
          description: Restrict to obsolete or active currencies. Omit to return both.
          schema: { type: boolean }
      responses:
        "200":
          $ref: "#/components/responses/CurrencyPageOk"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/currencies/{idOrCode}:
    get:
      tags: [currencies]
      operationId: getCurrency
      summary: Load one currency
      description: >
        Accepts a numeric identifier, an ISO 4217 alpha code such as `EUR`, or an ISO 4217 numeric
        code such as `978`. Obsolete currencies are only returned when `withObsolete` is true.
      parameters:
        - name: idOrCode
          in: path
          required: true
          description: Numeric identifier, ISO 4217 alpha code, or ISO 4217 numeric code.
          schema: { type: string }
          example: EUR
        - name: withObsolete
          in: query
          required: false
          description: Allow an obsolete currency to be returned. Defaults to false.
          schema: { type: boolean }
        - $ref: "#/components/parameters/Lang"
        - $ref: "#/components/parameters/CurrencyInclude"
      responses:
        "200":
          $ref: "#/components/responses/CurrencyOk"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/cryptos:
    get:
      tags: [cryptos]
      operationId: listCryptos
      summary: List or search cryptocurrencies
      description: >
        Returns cryptocurrencies ordered by name. `query` runs a relevance-ranked search over names,
        ticker symbols and aliases. Coin names are the same in every language, so `lang` only selects
        the collation order.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Lang"
        - $ref: "#/components/parameters/CryptoInclude"
        - name: obsolete
          in: query
          required: false
          description: Restrict to obsolete or active coins. Omit to return both.
          schema: { type: boolean }
      responses:
        "200":
          $ref: "#/components/responses/CryptoPageOk"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/cryptos/{idOrCode}:
    get:
      tags: [cryptos]
      operationId: getCrypto
      summary: Load one cryptocurrency
      description: >
        Accepts a numeric identifier, a ticker symbol such as `BTC`, or the coin's alias. The alias
        is the stable lowercase key a ticker can be renamed away from.
      parameters:
        - name: idOrCode
          in: path
          required: true
          description: Numeric identifier, ticker symbol, or alias.
          schema: { type: string }
          example: BTC
        - $ref: "#/components/parameters/Lang"
        - $ref: "#/components/parameters/CryptoInclude"
      responses:
        "200":
          $ref: "#/components/responses/CryptoOk"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/currencies/{idOrCode}/countries:
    get:
      tags: [currencies]
      operationId: listCurrencyCountries
      summary: List the countries that use a currency
      parameters:
        - name: idOrCode
          in: path
          required: true
          description: Numeric identifier, ISO 4217 alpha code, or ISO 4217 numeric code.
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Lang"
        - $ref: "#/components/parameters/CountryInclude"
      responses:
        "200":
          $ref: "#/components/responses/CountryPageOk"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/currencies/{idOrCode}/central-banks:
    get:
      tags: [currencies]
      operationId: listCurrencyCentralBanks
      summary: List the central banks that issue a currency
      parameters:
        - name: idOrCode
          in: path
          required: true
          description: Numeric identifier, ISO 4217 alpha code, or ISO 4217 numeric code.
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Lang"
        - $ref: "#/components/parameters/CentralBankInclude"
      responses:
        "200":
          $ref: "#/components/responses/CentralBankPageOk"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/languages:
    get:
      tags: [languages]
      operationId: listLanguages
      summary: List or search languages
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Lang"
        - $ref: "#/components/parameters/LanguageInclude"
      responses:
        "200":
          $ref: "#/components/responses/LanguagePageOk"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/languages/{idOrCode}:
    get:
      tags: [languages]
      operationId: getLanguage
      summary: Load one language
      description: Accepts a numeric identifier or a language code such as `fr`.
      parameters:
        - name: idOrCode
          in: path
          required: true
          description: Numeric identifier or language code.
          schema: { type: string }
          example: fr
        - $ref: "#/components/parameters/Lang"
        - $ref: "#/components/parameters/LanguageInclude"
      responses:
        "200":
          $ref: "#/components/responses/LanguageOk"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/languages/{idOrCode}/countries:
    get:
      tags: [languages]
      operationId: listLanguageCountries
      summary: List the countries that use a language
      parameters:
        - name: idOrCode
          in: path
          required: true
          description: Numeric identifier or language code.
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Lang"
        - $ref: "#/components/parameters/CountryInclude"
      responses:
        "200":
          $ref: "#/components/responses/CountryPageOk"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/regions:
    get:
      tags: [regions]
      operationId: listRegions
      summary: List or search regions
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Lang"
        - $ref: "#/components/parameters/RegionInclude"
      responses:
        "200":
          $ref: "#/components/responses/RegionPageOk"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/regions/{id}:
